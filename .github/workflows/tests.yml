name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Neovim ${{ matrix.neovim }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        neovim: [v0.11.0, stable]
    defaults:
      run:
        shell: bash
    env:
      TERM: xterm-256color
      LANG: en_US.UTF-8
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Install Ranger
        run: python -m pip install --disable-pip-version-check ranger-fm==1.9.4

      - name: Show runtime versions
        run: |
          nvim --version
          python --version
          ranger --version

      - name: Run integration tests
        id: integration
        env:
          NVIM_LOG_FILE: ${{ runner.temp }}/neoranger-integration.log
        run: nvim --headless -u NONE -i NONE -l tests/run.lua

      - name: Run Ranger smoke tests
        if: ${{ !cancelled() && (success() || steps.integration.outcome == 'failure') }}
        env:
          NVIM_LOG_FILE: ${{ runner.temp }}/neoranger-ranger.log
        run: nvim --headless -u NONE -i NONE -l tests/ranger.lua
